<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-7 col-lg-5">
      <div class="card-dark p-4 p-md-5 shadow-sm">
        <div class="text-center mb-4">
          <i class="bi bi-key fs-2 text-primary"></i>
          <h2 class="h4 mt-2 mb-1">Recuperar contraseña</h2>
          <p class="text-muted-soft small mb-0">Te enviaremos un enlace para restablecer tu acceso</p>
        </div>

        @if (mensaje) {
          <div class="alert py-2 small" [class.alert-danger]="esError" [class.alert-success]="!esError">
            {{ mensaje }}
          </div>
        }

        <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
          <div class="mb-4">
            <label class="form-label small">Correo registrado</label>
            <input type="email" class="form-control" formControlName="email" placeholder="correo@ejemplo.com" />
            @if (form.controls.email.touched && form.controls.email.invalid) {
              <div class="text-danger small mt-1">Ingresa un correo electrónico válido.</div>
            }
          </div>

          <button type="submit" class="btn btn-accent w-100 py-2">
            Enviar instrucciones
          </button>
        </form>

        <p class="text-center text-muted-soft small mt-4 mb-0">
          <a routerLink="/login">Volver al inicio de sesión</a>
        </p>
      </div>
    </div>
  </div>
</div>
